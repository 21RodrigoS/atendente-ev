[project]
name = "atendente-ev"
version = "0.1.0"
description = "Atendente de WhatsApp com IA (RAG + tool calling) para a E&V Polpas"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "fastembed>=0.4",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
