<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendente E&V</title>
<style>
  :root { --bg:#efeae2; --bar:#075e54; --me:#d9fdd3; --bot:#fff; --ink:#111; --muted:#667781; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b141a; --bar:#202c33; --me:#005c4b; --bot:#202c33; --ink:#e9edef; --muted:#8696a0; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink);
         height:100dvh; display:flex; flex-direction:column; max-width:560px; margin-inline:auto; }
  header { background:var(--bar); color:#fff; padding:12px 16px; }
  header strong { display:block; }
  header small { opacity:.8; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:80%; padding:8px 12px; border-radius:10px; white-space:pre-wrap; line-height:1.35; }
  .me { align-self:flex-end; background:var(--me); }
  .bot { align-self:flex-start; background:var(--bot); }
  .src { display:block; margin-top:4px; font-size:.75rem; color:var(--muted); }
  form { display:flex; gap:8px; padding:12px; background:var(--bar); }
  input { flex:1; padding:12px; border:0; border-radius:20px; font-size:1rem; }
  button { border:0; border-radius:20px; padding:0 18px; background:#25d366; color:#04290f;
           font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  footer { font-size:.7rem; color:var(--muted); text-align:center; padding:4px 8px 8px; }
</style>
</head>
<body>
<header><strong>Atendente E&V</strong><small>Simulador de WhatsApp · IA com RAG</small></header>
<div id="chat" aria-live="polite"></div>
<form id="form">
  <input id="text" autocomplete="off" placeholder="Digite uma mensagem" maxlength="1000" required>
  <button id="send">Enviar</button>
</form>
<footer>Demonstração: as respostas são geradas por IA e podem conter erros.</footer>
<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const text = document.getElementById("text");
  const send = document.getElementById("send");
  let sid;
  try { sid = sessionStorage.getItem("sid"); } catch (e) {}
  if (!sid) {
    sid = "web-" + Math.random().toString(36).slice(2, 10);
    try { sessionStorage.setItem("sid", sid); } catch (e) {}
  }

  function add(kind, content, sources) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = content;
    if (sources && sources.length) {
      const s = document.createElement("span");
      s.className = "src";
      s.textContent = "Fonte: " + sources.join(", ");
      div.appendChild(s);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  add("bot", "Olá! Sou o atendente virtual da E&V Polpas. Pergunte sobre sabores, preços, clube ou faça um pedido.");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = text.value.trim();
    if (!message) return;
    add("me", message);
    text.value = "";
    send.disabled = true;
    try {
      const resp = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sid, message }),
      });
      if (resp.status === 429) add("bot", "Muitas mensagens seguidas. Aguarde um instante.");
      else if (!resp.ok) add("bot", "Não consegui enviar sua mensagem. Tente de novo.");
      else { const data = await resp.json(); add("bot", data.reply, data.sources); }
    } catch (err) {
      add("bot", "Sem conexão com o servidor.");
    } finally {
      send.disabled = false;
      text.focus();
    }
  });
</script>
</body>
</html>
